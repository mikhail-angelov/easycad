services:
  app:
    container_name: easycad
    image: ghcr.io/mikhail-angelov/easycad:latest
    restart: unless-stopped
    networks:
      - proxy-net        # reachable by redoproxy + internet egress (LLM calls)
      - internal         # private link to the worker
    ports:
      - "127.0.0.1:8852:8852"
    env_file:
      - ./.env           # ALL app config + secrets live here — see .env.prod.example
    volumes:
      - ./data:/data     # accounts DB persists here (CAD sessions are in-memory)
    mem_limit: 1g        # bound app-tier memory against oversized payloads (review C1)
    pids_limit: 512
    labels:
      monic.enabled: "true"
      monic.check: "http"
      monic.check_http_url: "https://text2part.bconf.com"
      monic.name: "text2part"
      redoproxy.enabled: "true"
      redoproxy.domain: "text2part.bconf.com"
      redoproxy.port: 8852
      # /api/chat runs an LLM generation turn that can take longer than the proxy's
      # 30s default — without this the edge reset the (HTTP/2) connection mid-turn
      # (ERR_HTTP2_PROTOCOL_ERROR). Kept above the app's EASYCAD_LLM_TIMEOUT (90s)
      # so the app fails first with a clean 502 rather than the proxy timing out.
      redoproxy.timeout: 300
    depends_on:
      - worker
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    container_name: easycad-worker
    image: ghcr.io/mikhail-angelov/easycad-worker:latest
    restart: unless-stopped
    networks:
      - internal         # ONLY the private net → no internet egress
    read_only: true
    tmpfs:
      - /tmp:size=256m
    environment:
      # SPEC18 zygote-fork execution (docs/spec18.md). Value comes from .env via
      # substitution — nothing hardcoded here — and the worker receives ONLY this
      # var (no env_file) so it stays secret-free. Requires a SINGLE worker
      # process (enforced by a startup flock — no uvicorn --workers).
      - EASYCAD_WORKER_ZYGOTE=1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Docker applies its default seccomp profile automatically when not overridden.
    mem_limit: 1g
    pids_limit: 128
    cpus: "1.0"
    user: "10001:10001"
    # no secrets in env, no volumes, stateless
    # runtime: runsc     # future: gVisor drop-in for kernel isolation, no code change
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  proxy-net:
    external: true
  internal:
    internal: true       # no route outside → worker cannot reach the network
